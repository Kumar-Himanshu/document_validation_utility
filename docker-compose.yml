services:
  document-validation:
    build:
      context: .
      dockerfile: Dockerfile
    image: document-validation-utility:1.0.0
    container_name: document-validation-utility
    ports:
      - "8080:8080"
    environment:
      # Switch to "dev" for verbose local logging.
      SPRING_PROFILES_ACTIVE: prod
      JAVA_OPTS: "-XX:MaxRAMPercentage=75"
    read_only: true
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "sh", "-c", "wget -qO- http://localhost:8080/actuator/health/readiness || exit 1"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 20s
    restart: unless-stopped
